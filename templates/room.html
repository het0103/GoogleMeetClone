<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Room - GMeet Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/room.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/enhancements.css') }}">
</head>
<body>
    <div class="meeting-container">
        <!-- Header -->
        <div class="meeting-header">
            <div class="meeting-info">
                <h3>Meeting: <span id="roomId">{{ room_id }}</span></h3>
                <button id="copyLinkBtn" class="btn-icon" title="Copy meeting link">📋</button>
            </div>
            <div class="meeting-time" id="meetingTime">00:00</div>
        </div>

        <!-- Video Grid -->
        <div class="video-grid" id="videoGrid">
            <div class="video-container main-video">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">You</div>
                <div class="video-status" id="localVideoStatus"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="toggleAudioBtn" class="control-btn active" title="Mute/Unmute">
                🎤
            </button>
            <button id="toggleVideoBtn" class="control-btn active" title="Turn off camera">
                📹
            </button>
            <button id="toggleChatBtn" class="control-btn" title="Toggle chat">
                💬
            </button>
            <button id="participantsBtn" class="control-btn" title="Show participants">
                👥
            </button>
            <button id="shareScreenBtn" class="control-btn" title="Share screen">
                🖥️
            </button>
            <button id="leaveBtn" class="control-btn leave-btn" title="Leave meeting">
                📞
            </button>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <h3>Chat</h3>
                <button id="closeChatBtn" class="btn-close">✕</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500">
                <button id="sendMessageBtn">Send</button>
            </div>
        </div>

        <!-- Participants Panel -->
        <div class="participant-list" id="participantList">
            <div class="participant-list-header">
                <h3>Participants (<span id="participantCount">1</span>)</h3>
                <button id="closeParticipantsBtn" class="btn-close">✕</button>
            </div>
            <div class="participant-items" id="participantItems">
                <!-- Participants will be added here dynamically -->
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay" style="display: none;">
            <div class="loading-content">
                <div class="spinner"></div>
                <p>Connecting to meeting...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const ROOM_ID = "{{ room_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/room_enhanced.js') }}"></script>
</body>
</html>
